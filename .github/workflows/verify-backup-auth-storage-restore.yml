name: Verify backup Auth sign-in and Storage file restore

on:
  workflow_dispatch:

concurrency:
  group: production-database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auth-storage-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RESTORE_SCOPE: full
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Check out application
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create temporary production Auth and Storage demo data
        run: node scripts/backup_restore_demo_fixture.mjs seed
      - name: Create encrypted backup containing the demo data
        run: node scripts/backup_to_google_drive.mjs
      - name: Restore and verify Auth sign-in and actual Storage file bytes
        run: node scripts/verify_backup_restore.mjs
      - name: Remove temporary production demo data
        if: always()
        run: node scripts/backup_restore_demo_fixture.mjs cleanup
